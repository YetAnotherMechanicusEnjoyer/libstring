name: Zig Actions

run-name: Zig Actions | ${{ github.event_name }} by ${{ github.actor }} on '${{ github.ref_name }}'

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  actions:
    name: Zig Actions
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: YetAnotherMechanicusEnjoyer/zig-actions@v1
        with:
          zig-version: "0.16.0"
          command-test: "zig build test"
          failure-on-error: true
